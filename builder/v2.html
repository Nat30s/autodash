<main class="max-w-6xl mx-auto px-4 py-6"><div id="bApp"><div class="card p-8 text-center space-y-4 max-w-2xl mx-auto"><h1 class="text-2xl font-bold text-neutral-900 dark:text-white">Data builder</h1><p class="text-sm text-neutral-500">Pick Cars or Bikes above, then start from your Excel master or an existing JSON file. When you are done, download the JSON and upload it to the <code>data</code> folder.</p><div class="flex flex-wrap justify-center gap-2"><button data-act="startXl" class="pb">Excel master</button><button data-act="load" class="b2">Load JSON file</button><button data-act="startEmpty" class="b2">Start empty</button></div></div></div></main>
<input type="file" id="fLoad" accept=".json,.txt" class="hidden"><input type="file" id="fImp" accept=".csv,.json,.txt,.tsv" class="hidden"><input type="file" id="fXl" accept=".xlsx,.xlsm,.xls" class="hidden">
<div id="modal" class="hidden fixed inset-0 z-40 flex items-center justify-center p-4"><div data-act="closeModal" class="absolute inset-0 bg-black/40"></div>
  <div class="card relative w-full max-w-lg p-5 space-y-3 max-h-[85vh] overflow-y-auto"><div class="flex items-center justify-between"><h2 id="mTitle" class="font-bold text-neutral-900 dark:text-white"></h2><button data-act="closeModal" class="b2">✕</button></div><div id="mBody"></div></div></div>
<div id="toast" class="hidden"></div>
<script>
let DATA={schemaVersion:1,lastUpdated:'–',vehicles:[],sales:{}};
const SEGS={cars:{label:'Cars',noun:'cars',file:'data/cars.json'},bikes:{label:'Bikes',noun:'bikes',file:'data/bikes.json'}};
let SEG=Object.hasOwn(SEGS,location.hash.slice(1))?location.hash.slice(1):'cars';const JF=()=>SEGS[SEG].file.split('/').pop();
const $=s=>document.querySelector(s);
// ---- Theme ----
function setTheme(t){document.documentElement.classList.toggle('dark',t==='dark');try{localStorage.setItem('ap_theme',t)}catch(e){}}
try{setTheme(localStorage.getItem('ap_theme')||'light')}catch(e){}
$('#theme').onclick=()=>setTheme(document.documentElement.classList.contains('dark')?'light':'dark');
(function(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('en-IN').format(n);
const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const mlabel=(k,l)=>new Date(k+'-01T00:00:00').toLocaleDateString('en-US',{month:'short',year:l?'numeric':'2-digit'});
const today=()=>new Date().toISOString().slice(0,10);
const nextMonth=m=>{let[y,o]=m.split('-').map(Number);o++;if(o>12){o=1;y++}return y+'-'+String(o).padStart(2,'0')};
const slug=t=>t.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const vkey=(a,b)=>nkey(a)+'|'+nkey(b);
const uid=(d,mfg,model)=>{const b=slug(mfg+' '+model)||'model',u=new Set(d.vehicles.map(v=>v.id));let id=b,n=2;while(u.has(id))id=b+'-'+n++;return id};
const chk=(y,o)=>y>=1990&&y<=2100&&o>=1&&o<=12?y+'-'+String(o).padStart(2,'0'):null;
function normPeriod(s){s=String(s??'').trim();let m;
 if(m=s.match(/^(\d{4})[-\/.](\d{1,2})$/))return chk(+m[1],+m[2]);
 if(m=s.match(/^(\d{1,2})[-\/.](\d{4})$/))return chk(+m[2],+m[1]);
 if(m=s.match(/^([A-Za-z]{3,9})[\s\-'\/.,]*(\d{2}|\d{4})$/)){const i=MON.indexOf(m[1].slice(0,3).toLowerCase());if(i<0)return null;let y=+m[2];if(y<100)y+=2000;return chk(y,i+1)}
 return null}
function parseUnits(s){s=String(s??'').replace(/[,\s"']/g,'');if(s==='')return null;return /^\d+$/.test(s)?parseInt(s,10):NaN}
function toast(t,bad){const e=$('#toast');e.textContent=t;e.className='fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-lg text-sm font-medium shadow-lg '+(bad?'bg-rose-600 text-white':'bg-neutral-900 text-white dark:bg-white dark:text-neutral-900');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hidden'),3500)}
function modal(title,body,wide){$('#mTitle').textContent=title;$('#mBody').innerHTML=body;$('#modal').firstElementChild.nextElementSibling.classList.toggle('max-w-3xl',!!wide);$('#modal').firstElementChild.nextElementSibling.classList.toggle('max-w-lg',!wide);$('#modal').classList.remove('hidden')}
const closeModal=()=>$('#modal').classList.add('hidden');

// ---- Name matching, aliases and the "Match names" step ----
const nkey=s=>String(s).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'');
const pairKey=(a,b)=>nkey(a)+'|'+nkey(b);
function aliasMap(){const m=new Map(),ids=new Set(DATA.vehicles.map(v=>v.id));Object.entries(DATA.aliases||{}).forEach(([k,id])=>{const i=k.indexOf('|');if(i>0&&ids.has(id))m.set(pairKey(k.slice(0,i),k.slice(i+1)),id)});return m}
function matchVehicle(mfg,model){const k=pairKey(mfg,model),a=aliasMap().get(k);if(a)return a;const v=DATA.vehicles.find(x=>pairKey(x.mfg,x.model)===k);return v?v.id:null}
const canonBrand=m=>{const v=DATA.vehicles.find(x=>nkey(x.mfg)===nkey(m));return v?v.mfg:String(m).trim().replace(/\s+/g,' ')};
function lev(a,b){const d=Array.from({length:b.length+1},(_,j)=>j);for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function sim(a,b){if(!a||!b)return 0;if(a===b)return 1;const[x,y]=a.length<b.length?[a,b]:[b,a],dg=t=>t.replace(/[^0-9]/g,'');
 let s=(x.length>=3&&(y.startsWith(x)||y.endsWith(x)))?.65:1-lev(a,b)/Math.max(a.length,b.length);if(dg(a)!==dg(b))s=Math.min(s,.5);return s}
function suggest(mfg,model){const bk=nkey(mfg),mk=nkey(model);let pool=DATA.vehicles.filter(v=>nkey(v.mfg)===bk);if(!pool.length)pool=DATA.vehicles;
 const sc=pool.map(v=>({v,s:sim(mk,nkey(v.model))})).sort((a,b)=>b.s-a.s);return sc[0]&&sc[0].s>=.6?sc[0]:null}
let RES=null;
function resolveNames(items,then){if(!items.length)return then(new Map());RES={items,then};
 const rows=items.map((it,i)=>{const sg=suggest(it.mfg,it.model),def=sg&&sg.s>=.7?'v:'+sg.v.id:'new',bk=nkey(it.mfg),same=DATA.vehicles.filter(v=>nkey(v.mfg)===bk),pool=same.length?same:sortedVehicles();
  return`<tr class="align-top"><td class="py-2 pr-3"><div class="font-medium">${esc(it.model)}</div><div class="text-xs text-neutral-500">${esc(it.mfg)} · ${fmt(it.units)}${it.n>1?' · '+it.n+' values':''}</div></td><td class="py-2"><select data-i="${i}" class="sl !mt-0"><option value="new" ${def==='new'?'selected':''}>Add as new model</option><option value="skip">Skip</option><optgroup label="Map to existing model">${pool.map(v=>`<option value="v:${esc(v.id)}" ${def==='v:'+v.id?'selected':''}>${esc(v.mfg)} ${esc(v.model)}${sg&&sg.v.id===v.id?' (closest)':''}</option>`).join('')}</optgroup></select></td></tr>`}).join('');
 modal('Match names',`<p class="text-sm text-neutral-500 mb-3">${items.length} name${items.length>1?'s don’t':' doesn’t'} match an existing model. Choose what to do with each one. Nothing changes until you confirm.</p><div class="flex gap-4 text-xs mb-2"><button data-act="resAll" data-v="new" class="underline">All → add as new</button><button data-act="resAll" data-v="skip" class="underline">All → skip</button></div>
 <div class="max-h-[50vh] overflow-y-auto"><table class="w-full text-sm"><tbody id="resBody">${rows}</tbody></table></div><label class="text-sm flex items-center gap-2 mt-3"><input type="checkbox" id="resRem" checked> Remember mappings to existing models (saved in ${JF()})</label><div class="flex justify-end gap-2 pt-3"><button data-act="resCancel" class="b2">Cancel</button><button data-act="resGo" class="pb">Confirm</button></div>`,1)}
function resGo(){const map=new Map(),rem=$('#resRem').checked;let nn=0,mp=0,sk=0;
 $$('#resBody select').forEach(s=>{const it=RES.items[+s.dataset.i],pk=pairKey(it.mfg,it.model),v=s.value;if(v==='skip'){sk++;return}
  if(v==='new'){const b=canonBrand(it.mfg),m=it.model.trim().replace(/\s+/g,' '),nv={id:uid(DATA,b,m),mfg:b,model:m};DATA.vehicles.push(nv);map.set(pk,nv.id);nn++;return}
  const vid=v.slice(2);map.set(pk,vid);mp++;if(rem){DATA.aliases=DATA.aliases||{};DATA.aliases[it.mfg.trim()+'|'+it.model.trim()]=vid}});
 const f=RES.then;RES=null;closeModal();if(nn||mp)markDirty();f(map,{nn,mp,sk})}
function aliasSection(){const a=Object.entries(DATA.aliases||{}),V=Object.fromEntries(DATA.vehicles.map(v=>[v.id,v]));if(!a.length)return'';
 return`<h2 class="text-xs font-semibold uppercase tracking-wider text-neutral-500 pt-4">Name mappings <span class="normal-case font-normal">(saved in ${JF()})</span></h2><div class="card overflow-x-auto"><table class="w-full text-sm"><thead class="th"><tr><th class="text-left px-4 py-3">Source name</th><th class="text-left px-4 py-3">Maps to</th><th class="px-4 py-3"></th></tr></thead><tbody class="divide-y divide-neutral-200 dark:divide-neutral-800">${a.map(([k,id])=>`<tr><td class="px-4 py-2.5">${esc(k.replace('|',' · '))}</td><td class="px-4 py-2.5">${V[id]?esc(V[id].mfg+' '+V[id].model):esc(id)}</td><td class="px-4 py-2.5 text-right text-xs"><button data-act="delAlias" data-k="${esc(k)}" class="underline text-rose-600">Remove</button></td></tr>`).join('')}</tbody></table></div>`}

// ---- State ----
const dk=()=>'ap_builder_draft_v1_'+SEG;
let YO={},dirty=false,tab='set',AM={month:'',vals:{}},AQ='',IMP={rows:[],text:''},DQ='';

function normalize(x){
 if(Array.isArray(x)&&x.length&&x[0]&&x[0].sales){const d={schemaVersion:1,lastUpdated:today(),unit:'units',vehicles:[],sales:{}};
  x.forEach(r=>{const id=uid(d,r.mfg,r.model);d.vehicles.push({id,mfg:r.mfg,model:r.model});Object.entries(r.sales||{}).forEach(([m,v])=>{(d.sales[m]=d.sales[m]||{})[id]=+v})});return d}
 if(x&&Array.isArray(x.vehicles)&&x.sales&&typeof x.sales==='object'&&!Array.isArray(x.sales)){
  const ids=new Set();x.vehicles.forEach(v=>{if(!v||typeof v.id!=='string'||typeof v.mfg!=='string'||typeof v.model!=='string')throw Error('A vehicle is missing id, mfg or model');if(ids.has(v.id))throw Error('Duplicate vehicle id: '+v.id);ids.add(v.id)});
  Object.entries(x.sales).forEach(([m,o])=>{if(!/^\d{4}-\d{2}$/.test(m))throw Error('Bad month key: '+m);Object.entries(o).forEach(([id,u])=>{if(!ids.has(id))throw Error('Sales refer to unknown vehicle: '+id);if(!Number.isInteger(u)||u<0)throw Error('Bad value for '+id+' in '+m)})});
  if(x.aliases){if(typeof x.aliases!=='object'||Array.isArray(x.aliases))throw Error('aliases must be an object');Object.keys(x.aliases).forEach(k=>{if(!ids.has(x.aliases[k]))delete x.aliases[k]})}
  return x}
 throw Error('Not a recognised '+JF()+' file')}
const months=()=>Object.keys(DATA.sales).sort();
function saveDraft(){try{localStorage.setItem(dk(),JSON.stringify(DATA))}catch(e){}}
function markDirty(){dirty=true;saveDraft();renderBar();renderTabs();window.onDataChanged&&window.onDataChanged()}
function setMonth(m){AM.month=m;AM.vals=Object.fromEntries(Object.entries(DATA.sales[m]||{}).map(([k,v])=>[k,String(v)]))}
function setData(d,isDirty){DATA=d;dirty=!!isDirty;if(dirty)saveDraft();const ms=months();setMonth(ms.length?nextMonth(ms[ms.length-1]):today().slice(0,7));AM.vals={};tab='set';AQ='';DQ='';IMP={rows:[],text:''};shell();window.onDataChanged&&window.onDataChanged()}
window.onbeforeunload=e=>{if(dirty){e.preventDefault();return''}};

// ---- Shell ----

function shell(){$('#bApp').innerHTML='<div id="bar"></div><div id="tabs"></div><div id="pane" class="space-y-4"></div>';renderBar();renderTabs();renderPane()}
function renderBar(){const ms=months(),br=new Set(DATA.vehicles.map(v=>v.mfg));
 $('#bar').innerHTML=`<div class="flex flex-col lg:flex-row lg:items-end justify-between gap-3"><div><h1 class="text-xl font-bold text-neutral-900 dark:text-white">Data builder</h1>
 <p class="text-sm text-neutral-500">${DATA.vehicles.length} models · ${br.size} brands · ${ms.length} months${ms.length?` (${mlabel(ms[0],1)} – ${mlabel(ms[ms.length-1],1)})`:''} · updated ${esc(DATA.lastUpdated||'–')}</p></div>
 <div class="flex flex-wrap items-center gap-2"><span class="flex items-center gap-1.5 text-xs text-neutral-500"><span class="w-2 h-2 rounded-full ${dirty?'bg-amber-500':'bg-emerald-500'}"></span>${dirty?'Unsaved changes':'Saved'}</span>
 <button data-act="load" class="b2">Load ${JF()}</button><button data-act="copy" class="b2">Copy JSON</button><button data-act="download" class="pb">Download ${JF()}</button></div></div>`}
function renderTabs(){const n=computeIssues().length;
 $('#tabs').innerHTML=`<div class="flex gap-1 border-b border-neutral-200 dark:border-neutral-800 text-sm font-medium overflow-x-auto">`+[['set','Dataset'],['xl','Excel master'],['imp','Import'],['add','Add Month']].map(([k,l])=>`<button data-tab="${k}" class="px-4 py-2.5 -mb-px border-b-2 whitespace-nowrap ${tab===k?'border-neutral-900 dark:border-white text-neutral-900 dark:text-white':'border-transparent text-neutral-500'}">${l}</button>`).join('')+'</div>'}
function renderPane(){({add:renderAdd,imp:renderImport,set:renderDataset,xl:renderXl})[tab]()}
function go(t){tab=t;renderTabs();renderPane()}

// ---- Add month ----
function prevRef(m){const a=months().filter(x=>x<m);return a.length?a[a.length-1]:null}
function sortedVehicles(){return[...DATA.vehicles].sort((a,b)=>a.mfg.localeCompare(b.mfg)||a.model.localeCompare(b.model))}
function renderAdd(){
 const ref=prevRef(AM.month),rv=ref?DATA.sales[ref]:{};
 let g='',last='';sortedVehicles().forEach(v=>{if(v.mfg!==last){g+=`<div class="col-span-full text-xs font-semibold uppercase tracking-wider text-neutral-500 pt-3 first:pt-0" data-brand="${esc(v.mfg.toLowerCase())}">${esc(v.mfg)}</div>`;last=v.mfg}
  g+=`<label data-row="${esc((v.mfg+' '+v.model).toLowerCase())}" data-brand="${esc(v.mfg.toLowerCase())}" class="flex items-center justify-between gap-3 card px-3 py-2"><span class="text-sm truncate">${esc(v.model)}</span><input data-id="${esc(v.id)}" inputmode="numeric" autocomplete="off" class="cell sl !w-28 !mt-0 text-right num" value="${esc(AM.vals[v.id]??'')}" placeholder="${rv[v.id]!=null?fmt(rv[v.id]):''}"></label>`});
 $('#pane').innerHTML=`<div class="flex flex-wrap items-end gap-3"><label class="text-xs font-semibold uppercase tracking-wider text-neutral-500">Month<input type="month" id="amMonth" value="${AM.month}" class="sl !w-auto"></label>
 <input id="amQ" placeholder="Filter models…" value="${esc(AQ)}" class="sl !w-56 !mt-0"><button data-act="addModelOpen" class="b2">+ Add model</button><button data-act="pasteOpen" class="b2">Paste from Excel</button>
 ${ref?`<button data-act="prevCopy" class="b2">Copy ${mlabel(ref,1)} values</button>`:''}<button data-act="clearCells" class="b2">Clear</button></div>
 <p id="amInfo" class="text-xs text-neutral-500"></p><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">${g||'<p class="text-sm text-neutral-500">No models yet. Use “Add model” or the Import tab.</p>'}</div>
 <div class="flex justify-end"><button data-act="applyMonth" class="pb">Apply month to dataset</button></div>`;
 filterAdd();updAm()}
function cellVal(s){s=String(s??'').replace(/[,\s]/g,'');return s===''?null:/^\d+$/.test(s)?parseInt(s,10):NaN}
function updAm(){const m=AM.month,ref=prevRef(m),adj=!!ref&&nextMonth(ref)===m,rv=ref?DATA.sales[ref]:{},sv=DATA.sales[m]||null;let f=0,w=0,b=0,c=0;
 $$('#pane .cell').forEach(i=>{const v=cellVal(i.value),old=sv?(sv[i.dataset.id]??null):null;i.classList.remove('warn','bad','chg');i.title='';
  if(Number.isNaN(v)){i.classList.add('bad');i.title='Whole numbers only';b++}
  else{if(v!=null)f++;if(sv&&v!==old){i.classList.add('chg');i.title='Saved value: '+(old==null?'none':fmt(old));c++}
   if(v!=null&&adj){const o=rv[i.dataset.id];if(o!=null&&o>=100&&Math.abs(v-o)/o>.6){i.classList.add('warn');i.title=(v>o?'+':'')+Math.round((v-o)/o*100)+'% vs '+mlabel(ref);w++}}}});
 const e=$('#amInfo');if(e)e.innerHTML=(sv?`<b class="text-amber-600">Editing existing month</b> · `:'New month · ')+`${f} of ${DATA.vehicles.length} models filled${c?` · <b class="text-blue-600">${c} changed vs saved</b>`:''}${b?` · <b class="text-rose-600">${b} invalid</b>`:''}${w?` · <b class="text-amber-600">${w} big swing${w>1?'s':''}</b> (over 60% vs ${mlabel(ref)})`:''}${ref?` · grey hints show ${mlabel(ref,1)}${adj?'':' (not the previous month)'}`:''} · blank = no data`}
function filterAdd(){const q=AQ.toLowerCase().trim();$$('#pane [data-row]').forEach(r=>r.classList.toggle('hidden',!!q&&!r.dataset.row.includes(q)));
 $$('#pane div[data-brand]').forEach(h=>h.classList.toggle('hidden',!!q&&!$$('#pane label[data-brand]').some(l=>l.dataset.brand===h.dataset.brand&&!l.classList.contains('hidden'))))}
function applyMonth(){const m=AM.month;if(!/^\d{4}-\d{2}$/.test(m))return toast('Pick a month first',1);
 const o={};let bad=0;$$('#pane .cell').forEach(i=>{const v=cellVal(i.value);if(Number.isNaN(v))bad++;else if(v!=null)o[i.dataset.id]=v});
 if(bad)return toast(bad+' cell(s) are not whole numbers',1);if(!Object.keys(o).length)return toast('Enter at least one value',1);
 if(DATA.sales[m]&&!confirm(`${mlabel(m,1)} already has ${Object.keys(DATA.sales[m]).length} values. Replace them with these ${Object.keys(o).length}?`))return;
 const ex=!!DATA.sales[m];DATA.sales[m]=o;markDirty();setMonth(m);renderAdd();toast(`${ex?'Updated':'Added'} ${mlabel(m,1)} with ${Object.keys(o).length} values`)}
function addModelOpen(){modal('Add model',`<div class="space-y-3"><label class="block text-xs font-semibold uppercase tracking-wider text-neutral-500">Manufacturer<input id="nmMfg" list="nmBrands" class="sl"><datalist id="nmBrands">${[...new Set(DATA.vehicles.map(v=>v.mfg))].sort().map(b=>`<option value="${esc(b)}">`).join('')}</datalist></label>
 <label class="block text-xs font-semibold uppercase tracking-wider text-neutral-500">Model<input id="nmModel" class="sl"></label><div class="flex justify-end"><button data-act="addModel" class="pb">Add model</button></div></div>`)}
function addModel(){const a=$('#nmMfg').value.trim().replace(/\s+/g,' '),b=$('#nmModel').value.trim().replace(/\s+/g,' ');if(!a||!b)return toast('Enter manufacturer and model',1);
 if(DATA.vehicles.some(v=>vkey(v.mfg,v.model)===vkey(a,b)))return toast('That model already exists',1);
 DATA.vehicles.push({id:uid(DATA,a,b),mfg:a,model:b});closeModal();markDirty();if(tab==='add')renderAdd();toast(`Added ${a} ${b}`)}
function pasteOpen(){modal('Paste from Excel',`<div class="space-y-3"><p class="text-xs text-neutral-500">Paste three columns straight from Excel: <b>Maker, Model, Units</b> for <b>${mlabel(AM.month,1)}</b>. Blank rows and TOTAL rows are ignored. Names are matched ignoring case, accents and spaces, and anything unmatched is shown for your approval. Two columns (<b>Model, units</b>) or a plain column of numbers also work.</p><textarea id="psText" rows="10" class="sl font-mono text-xs" placeholder="Citroen&#9;C3&#9;220&#10;Citroen&#9;E C3&#9;61"></textarea><div class="flex justify-end"><button data-act="pasteApply" class="pb">Fill cells</button></div></div>`)}
function pasteApply(){const lines=$('#psText').value.split(/\r?\n/),V=sortedVehicles(),rows=[],legacy=[],bad=[],isTot=s=>/^(grand\s*|sub\s*)?total$/i.test(String(s).trim());let totals=0,pos=0,n=0,first=true;
 lines.forEach(raw=>{const l=raw.replace(/\u00a0/g,' ').trim();if(!l.replace(/[\t,]/g,'').trim())return;
  const p=(l.includes('\t')?l.split('\t'):l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/)).map(x=>x.trim().replace(/^"|"$/g,''));
  if(p.length>=3){if(isTot(p[1])||isTot(p[0])){totals++;return}if(!p[0]||!p[1])return;const u=parseUnits(p[2]);if(u==null)return;
   if(Number.isNaN(u)){if(first&&/^[a-z]/i.test(p[2])){first=false;return}bad.push(p[0]+' '+p[1]);return}first=false;rows.push({mfg:p[0],model:p[1],units:u,pk:pairKey(p[0],p[1])})}
  else if(p.length===2){if(isTot(p[0])){totals++;return}legacy.push(p)}

 $('#pane').innerHTML='<p class="text-sm text-neutral-500">These are suggestions to double-check, not errors. Swings over 60% month on month are flagged for models selling 200+ units.</p>'+Object.entries(g).map(([t,a])=>`<div class="card overflow-hidden"><div class="px-4 py-2.5 th flex justify-between"><span>${t}</span><span>${a.length}</span></div><div class="divide-y divide-neutral-200 dark:divide-neutral-800">${a.slice(0,40).map(([x,i])=>`<div class="px-4 py-2.5 flex items-center justify-between gap-3 text-sm"><div class="min-w-0"><div class="font-medium truncate">${esc(x.title)}</div><div class="text-xs text-neutral-500">${esc(x.detail)}</div></div><button data-act="review" data-i="${i}" class="b2 shrink-0">Review</button></div>`).join('')}${a.length>40?`<div class="px-4 py-2 text-xs text-neutral-500">+ ${a.length-40} more</div>`:''}</div></div>`).join('')}
function review(i){const x=computeIssues()[i];if(!x)return;if(x.m){setMonth(x.m);go('add')}else{DQ=x.q||'';go('set')}}

// ---- Export ----
function exportJSON(){DATA.lastUpdated=today();const ms=months(),known=['schemaVersion','lastUpdated','unit','vehicles','sales','aliases'],rest=Object.keys(DATA).filter(k=>!known.includes(k)),al=Object.entries(DATA.aliases||{});
 return'{\n  "schemaVersion": '+(DATA.schemaVersion||1)+',\n  "lastUpdated": "'+DATA.lastUpdated+'",\n  "unit": '+JSON.stringify(DATA.unit||'units')+',\n  "vehicles": [\n'+DATA.vehicles.map(v=>'    '+JSON.stringify(v)).join(',\n')+'\n  ],\n  "sales": {\n'+
  ms.map(m=>'    "'+m+'": '+JSON.stringify(Object.fromEntries(Object.entries(DATA.sales[m]).sort((a,b)=>a[0]<b[0]?-1:1)))).join(',\n')+'\n  }'+(al.length?',\n  "aliases": {\n'+al.map(([k,v])=>'    '+JSON.stringify(k)+': '+JSON.stringify(v)).join(',\n')+'\n  }':'')+rest.map(k=>',\n  '+JSON.stringify(k)+': '+JSON.stringify(DATA[k])).join('')+'\n}\n'}
// ---- Excel master (full rebuild) ----
let XL=null;
const isTot=s=>/^(grand\s*|sub\s*)?total$/i.test(String(s??'').trim());
const HMK=['maker','manufacturer','mfg','brand','make','oem','company'],HMD=['model','vehicle','car','name','modelname'];
function hdrPeriod(v,yr){let d=null;
 if(v instanceof Date&&!isNaN(v))d=new Date(v.getTime()+432e5);
 else if(typeof v==='number'&&v>20000&&v<80000)d=new Date(Math.round((v-25569)*864e5)+432e5);
 if(d)return chk(d.getUTCFullYear(),d.getUTCMonth()+1);
 const s=String(v??'').trim(),p=normPeriod(s);if(p)return p;
 const i=/^[A-Za-z]{3,9}$/.test(s)?MON.indexOf(s.slice(0,3).toLowerCase()):-1;return i>=0&&yr?chk(yr,i+1):null}
function xlParse(wb,fname){const rows=[],sheets=[],warn=[];
 wb.SheetNames.forEach(sn=>{const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null}),ym=sn.match(/(19|20)\d\d/),yr=ym?+ym[0]:null;let h=-1,cm=0,cd=0;
  for(let i=0;i<Math.min(aoa.length,40)&&h<0;i++){const r=aoa[i]||[],a=r.findIndex(c=>HMK.includes(nkey(c??''))),b=r.findIndex(c=>HMD.includes(nkey(c??'')));if(a>=0&&b>=0&&a!==b){h=i;cm=a;cd=b}}
  if(h<0){sheets.push({sn,note:'No Maker / Model header found, skipped'});return}
  const cols=[];(aoa[h]||[]).forEach((c,j)=>{if(j===cm||j===cd)return;const p=hdrPeriod(c,yr);if(p)cols.push({j,p})});
  if(!cols.length){sheets.push({sn,note:'No month columns found, skipped'});return}
  if(new Set(cols.map(c=>c.p)).size<cols.length)warn.push(`${sn}: the same month appears in two columns (later column wins)`);
  let last='',n=0;const sum={},tot=[],seen=new Set();
  for(let i=h+1;i<aoa.length;i++){const r=aoa[i]||[],mk=String(r[cm]??'').trim().replace(/\s+/g,' '),md=String(r[cd]??'').trim().replace(/\s+/g,' ');
   if(!mk&&!md)continue;
   if(isTot(mk)||isTot(md)){const br=(isTot(mk)||!mk)?last:mk;cols.forEach(c=>{if(typeof r[c.j]==='number')tot.push({br,p:c.p,v:r[c.j]})});continue}
   if(mk)last=mk;if(!md)continue;
   const br=mk||last;if(!br){warn.push(`${sn} row ${i+1}: “${md}” has no maker`);continue}
   const dk=pairKey(br,md);if(seen.has(dk))warn.push(`${sn} row ${i+1}: ${br} ${md} appears more than once (later row wins)`);seen.add(dk);n++;
   cols.forEach(c=>{const v=r[c.j];if(v==null||v==='')return;const u=typeof v==='number'?(Number.isInteger(v)&&v>=0?v:NaN):parseUnits(v);if(u==null)return;
    if(Number.isNaN(u)){warn.push(`${sn} ${br} ${md} ${mlabel(c.p)}: “${v}” is not a whole number, ignored`);return}
    rows.push({mfg:br,model:md,period:c.p,units:u});sum[br+'|'+c.p]=(sum[br+'|'+c.p]||0)+u})}
  tot.forEach(t=>{const s=sum[t.br+'|'+t.p];if(s!=null&&s!==t.v)warn.push(`${sn} ${t.br} ${mlabel(t.p)}: TOTAL row says ${fmt(t.v)}, models add up to ${fmt(s)}`)});
  sheets.push({sn,hdr:h+1,months:cols.length,models:n})});
 XL={fname,rows,sheets,warn};xlAnalyze()}
function xlAnalyze(){const grp=new Map(),vals=new Map();
 XL.rows.forEach(r=>{const k=pairKey(r.mfg,r.model);if(!grp.has(k))grp.set(k,{mfg:r.mfg,model:r.model,vid:matchVehicle(r.mfg,r.model),n:0,units:r.units});const g=grp.get(k);g.n++;g.units=r.units;vals.set(r.period+'~'+k,{p:r.period,k,u:r.units})});
 const V=[...vals.values()],ms=[...new Set(V.map(v=>v.p))].sort(),used=new Set();let add=0,chg=0,same=0;
 V.forEach(v=>{const g=grp.get(v.k);if(!g.vid)return;used.add(g.vid);const o=DATA.sales[v.p]?.[g.vid];o==null?add++:o===v.u?same++:chg++});
 XL.grp=grp;XL.V=V;XL.ms=ms;XL.st={add,chg,same,newM:[...grp.values()].filter(g=>!g.vid),gone:DATA.vehicles.filter(v=>!used.has(v.id)),dropM:months().filter(m=>!ms.includes(m)),brands:new Set([...grp.values()].map(g=>nkey(g.mfg))).size}}
function xlLoad(f){if(!window.XLSX)return toast('Excel reader did not load, check your connection',1);const r=new FileReader();
 r.onload=()=>{try{xlParse(XLSX.read(r.result,{type:'array',cellDates:true}),f.name)}catch(e){XL=null;toast('Could not read this file: '+e.message,1)}renderXl()};r.readAsArrayBuffer(f)}
function renderXl(){const zone=`<div id="xlZone" class="rounded-2xl border-2 border-dashed border-neutral-300 dark:border-neutral-700 p-6 text-center space-y-2"><p class="text-sm font-semibold">${XL?esc(XL.fname):'Drop your master Excel file here'}</p><p class="text-xs text-neutral-500">One sheet per year. The header row has <b>Maker</b>, <b>Model</b>, then one column per month (real dates or “Aug-26”). Blank means no data, 0 means zero sales. Brand TOTAL rows are checked, then skipped. This is a <b>full rebuild</b>: Excel replaces all sales in ${JF()}, while existing IDs and name mappings are kept.</p><button data-act="xlPick" class="b2">${XL?'Choose another file':'Choose file'}</button></div>`;
 if(!XL){$('#pane').innerHTML=zone;return}
 const S=XL.st,ok=XL.V.length>0,nm=S.newM.map(g=>g.mfg+' '+g.model),gn=S.gone.map(v=>v.mfg+' '+v.model),lst=(a,c)=>a.length?`<p class="text-xs mt-2"><b class="${c}">${a.length}</b> ${a.slice(0,25).map(esc).join(', ')}${a.length>25?' …':''}</p>`:'';
 $('#pane').innerHTML=zone+`<div class="card overflow-hidden"><table class="w-full text-xs"><thead class="th"><tr><th class="text-left px-4 py-2">Sheet</th><th class="text-right px-2 py-2">Header row</th><th class="text-right px-2 py-2">Months</th><th class="text-right px-4 py-2">Model rows</th></tr></thead><tbody class="divide-y divide-neutral-200 dark:divide-neutral-800">${XL.sheets.map(s=>s.note?`<tr><td class="px-4 py-2">${esc(s.sn)}</td><td colspan="3" class="px-4 text-right text-neutral-500">${esc(s.note)}</td></tr>`:`<tr><td class="px-4 py-2 font-medium">${esc(s.sn)}</td><td class="px-2 text-right num">${s.hdr}</td><td class="px-2 text-right num">${s.months}</td><td class="px-4 text-right num">${s.models}</td></tr>`).join('')}</tbody></table></div>
 <div class="card p-4 text-sm">${ok?`<p><b>${XL.ms.length}</b> months (${mlabel(XL.ms[0],1)} – ${mlabel(XL.ms[XL.ms.length-1],1)}) · <b>${XL.grp.size}</b> models · <b>${S.brands}</b> brands · <b>${XL.V.length}</b> values</p><p class="text-xs text-neutral-500 mt-1">Compared with current ${JF()}: <b class="text-emerald-600">${S.add} new</b> · <b class="text-blue-600">${S.chg} changed</b> · ${S.same} unchanged · <b class="text-rose-600">${S.dropM.length} month${S.dropM.length===1?'':'s'} dropped</b></p>`:'<p class="text-rose-600">No sales values found in this file.</p>'}
 ${lst(nm,'text-amber-600')?'<p class="text-xs text-neutral-500 mt-2">New names (you will approve or map these next):</p>'+lst(nm,'text-amber-600'):''}${gn.length?'<p class="text-xs text-neutral-500 mt-2">In '+JF()+' but not in Excel (removed on rebuild unless mapped):</p>'+lst(gn,'text-rose-600'):''}</div>
 ${XL.warn.length?`<div class="card p-4"><p class="text-xs font-semibold uppercase tracking-wider text-amber-600 mb-2">${XL.warn.length} warning${XL.warn.length>1?'s':''}</p><ul class="text-xs space-y-1 max-h-48 overflow-auto">${XL.warn.slice(0,40).map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`:''}
 <div class="flex justify-end"><button data-act="xlRebuild" class="pb" ${ok?'':'disabled'}>Rebuild ${JF()} from Excel</button></div>`}
function xlRebuild(){if(!XL||!XL.V.length)return;const S=XL.st;
 if((S.gone.length||S.dropM.length)&&!confirm(`Full rebuild: Excel replaces everything in ${JF()}.\n\nUp to ${S.gone.length} model(s) and ${S.dropM.length} month(s) not in this Excel will be removed. Continue?`))return;
 resolveNames(S.newM,map=>{const ns={},used=new Set();let skip=0;
  XL.V.forEach(v=>{const id=XL.grp.get(v.k).vid||map.get(v.k);if(!id){skip++;return}used.add(id);(ns[v.p]=ns[v.p]||{})[id]=v.u});
  DATA.sales=ns;DATA.vehicles=DATA.vehicles.filter(v=>used.has(v.id));
  Object.keys(DATA.aliases||{}).forEach(k=>{if(!used.has(DATA.aliases[k]))delete DATA.aliases[k]});
  DATA.lastUpdated=today();const m=months();setMonth(m.length?nextMonth(m[m.length-1]):today().slice(0,7));AM.vals={};
  const f=XL.fname;XL=null;markDirty();go('set');toast(`Rebuilt from ${f}: ${DATA.vehicles.length} models, ${m.length} months`+(skip?`, ${skip} values skipped`:''))})}
// ---- Events ----
const ACT={xlPick:()=>$('#fXl').click(),xlRebuild,
 load:()=>$('#fLoad').click(),resume:()=>{try{setData(normalize(JSON.parse(localStorage.getItem(dk()))),true)}catch(e){toast('Draft could not be read',1)}},
 startXl:()=>{ACT.startEmpty();go('xl')},startEmpty:()=>setData({schemaVersion:1,lastUpdated:today(),unit:'units',vehicles:[],sales:{}},false),
 download:async()=>{const txt=exportJSON();let dl=null;try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename:JF(),data:txt});dirty=false;renderBar();toast('Saved '+JF()+'')}catch(e){if(!e||e.code!=='declined')toast('Could not save — use Copy JSON instead',1)}return}
  const bl=new Blob([txt],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=JF();a.click();dirty=false;renderBar();toast('Downloaded '+JF()+'')},
 copy:async()=>{try{await navigator.clipboard.writeText(exportJSON());toast('JSON copied to clipboard')}catch(e){toast('Copy failed — use Download instead',1)}},
 togYear:a=>{const y=a.dataset.y;YO[y]=!yOpen(y);renderDataset()},closeModal,addModelOpen,addModel,pasteOpen,pasteApply,applyMonth,
 prevCopy:()=>{const r=prevRef(AM.month);if(!r)return;AM.vals=Object.fromEntries(Object.entries(DATA.sales[r]).map(([k,v])=>[k,String(v)]));renderAdd()},
 clearCells:()=>{AM.vals={};renderAdd()},impPick:()=>$('#fImp').click(),tpl:async()=>{try{await navigator.clipboard.writeText('Manufacturer,Model,Period,Units\nHyundai,Creta,2026-10,18200\nTata,Punch,2026-10,21000');toast('Template copied — paste it into the box or a spreadsheet')}catch(e){toast('Copy failed',1)}},impMerge,
 edit:a=>editRow(a.dataset.id),cancelEdit:renderDataset,saveEdit:a=>saveEdit(a.dataset.id),mergeOpen:a=>mergeOpen(a.dataset.id),mergeDo:a=>mergeDo(a.dataset.id),delModel:a=>delModel(a.dataset.id),
 editMonth:a=>{setMonth(a.dataset.m);go('add')},delMonth:a=>delMonth(a.dataset.m),review:a=>review(+a.dataset.i),resGo,resCancel:()=>{RES=null;closeModal()},resAll:a=>$$('#resBody select').forEach(x=>x.value=a.dataset.v),delAlias:a=>{delete DATA.aliases[a.dataset.k];markDirty();renderDataset()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(t&&DATA)return go(t.dataset.tab);const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act])ACT[a.dataset.act](a,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){RES=null;closeModal()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.impm){const[p,k]=t.dataset.impm.split('|');IMP.cfg[p][k]=t.checked;renderImpOut()}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.classList.contains('cell')){AM.vals[t.dataset.id]=t.value;updAm()}else if(t.id==='amQ'){AQ=t.value;filterAdd()}else if(t.id==='dsQ'){DQ=t.value;const p=t.selectionStart;renderDataset();const n=$('#dsQ');n.focus();n.setSelectionRange(p,p)}
 else if(t.id==='impText'){importParse(t.value);renderImpOut()}});
document.addEventListener('change',e=>{if(e.target.id==='amMonth'&&e.target.value){setMonth(e.target.value);renderAdd()}});
$('#fLoad').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(dirty&&!confirm('You have unsaved changes. Load a new file anyway?'))return;
 readFile(f,t=>{try{setData(normalize(JSON.parse(t)),false);toast(`Loaded ${DATA.vehicles.length} models, ${months().length} months`)}catch(err){toast(err.message||'Could not read file',1)}})};
$('#fImp').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)readFile(f,t=>{importParse(t);renderImport()})};
document.addEventListener('dragover',e=>{if($('#impZone'))e.preventDefault()});
document.addEventListener('drop',e=>{if(!$('#impZone')||!e.dataTransfer.files[0])return;e.preventDefault();readFile(e.dataTransfer.files[0],t=>{importParse(t);renderImport()})});

$('#fXl').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)xlLoad(f)};
document.addEventListener('dragover',e=>{if($('#xlZone'))e.preventDefault()});
document.addEventListener('drop',e=>{if(!$('#xlZone')||!e.dataTransfer.files[0])return;e.preventDefault();xlLoad(e.dataTransfer.files[0])});
window.BLD={normalize,setData,isDirty:()=>dirty,reset:()=>{dirty=false}};
})();

const BSTART=$('#bApp').innerHTML;
function segUI(){document.querySelectorAll('[data-seg]').forEach(b=>{const on=b.dataset.seg===SEG;b.className='px-3.5 py-1 rounded-lg text-sm font-semibold transition '+(on?'bg-white text-neutral-900 shadow-sm dark:bg-neutral-700 dark:text-white':'text-neutral-500 hover:text-neutral-900 dark:hover:text-white')})}
function switchSeg(t){if(t===SEG||!Object.hasOwn(SEGS,t))return;if(BLD.isDirty()&&!confirm('You have unsaved changes for '+SEGS[SEG].label+'. Switch anyway?'))return;SEG=t;history.replaceState(null,'','#'+t);segUI();DATA={schemaVersion:1,lastUpdated:'–',vehicles:[],sales:{}};$('#bApp').innerHTML=BSTART;BLD.reset()}
$('#segBar').onclick=e=>{const b=e.target.closest('[data-seg]');if(b)switchSeg(b.dataset.seg)};segUI();
